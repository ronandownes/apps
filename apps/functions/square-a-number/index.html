<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Square a Number</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:#23455d;background:white}.wrap{padding:10px;display:grid;gap:8px;justify-items:center}.numbers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}button{font:inherit;min-width:38px;padding:7px 10px;background:#eaf3fa;border:1px solid #a4c7df;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#d1e8fa;border-color:#2879b8;font-weight:700}.mapping{font-size:1.25rem;font-weight:650;min-height:36px}.hint{font-size:.83rem;color:#526779;text-align:center;margin:0}</style></head><body><div class="wrap"><div class="numbers" id="numbers" aria-label="Choose an input number"></div><div class="mapping" id="mapping" role="status" aria-live="polite">Choose a number</div><p class="hint">The same input always gives the same output.</p></div><script>const row=document.getElementById('numbers'),out=document.getElementById('mapping');for(let n=0;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.type='button';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));out.textContent=n+' → '+n+'² = '+(n*n)});row.appendChild(b)}</script></body></html>
