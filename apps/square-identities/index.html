const groups=[{"code":"AF82","title":"Identify conjugate binomials","items":[["$x+11$","Keep x. Reverse the second sign.","$x-11$"],["$a-3$","Keep a. Reverse the second sign.","$a+3$"],["$a-b$","Keep a. Reverse the second sign.","$a+b$"],["$3x+7$","Keep 3x. Reverse the second sign.","$3x-7$"],["$2x-5y$","Keep 2x. Reverse the second sign.","$2x+5y$"],["$4n+9$","Keep 4n. Reverse the second sign.","$4n-9$"]]},{"code":"AF83","title":"Reverse difference of squares","items":[["Expand $(3x+5)(3x-5)$.","$9x^2-15x+15x-25$","Opposite cross-products cancel.","$9x^2-25$"],["Factorise $9x^2-25$.","$9x^2=(3x)^2$, $25=5^2$.","Write the sum and difference.","$(3x+5)(3x-5)$"],["Expand $(x+11)(x-11)$.","$x^2-11x+11x-121$","$x^2-121$"],["Factorise $x^2-121$.","$121=11^2$.","$(x+11)(x-11)$"],["Expand $(4x-7)(4x+7)$.","$16x^2+28x-28x-49$","$16x^2-49$"],["Factorise $16x^2-49$.","$16x^2=(4x)^2$, $49=7^2$.","$(4x+7)(4x-7)$"]]},{"code":"AF84","title":"Reverse perfect algebraic squares","items":[["Expand $(3x+4)^2$.","$(3x+4)(3x+4)$","$9x^2+12x+12x+16$","$9x^2+24x+16$"],["Factorise $9x^2+24x+16$.","Roots: $3x$ and $4$.","$2(3x)(4)=24x$.","$(3x+4)^2$"],["Expand $(x+8)^2$.","$x^2+8x+8x+64$","$x^2+16x+64$"],["Factorise $x^2+16x+64$.","Roots: $x$ and $8$.","$2(x)(8)=16x$.","$(x+8)^2$"],["Expand $(5x-3)^2$.","$25x^2-15x-15x+9$","$25x^2-30x+9$"],["Factorise $25x^2-30x+9$.","Roots: $5x$ and $3$.","The middle term is negative.","$(5x-3)^2$"]]}];
const speech=[[["Keep x. Change plus eleven to minus eleven.","The conjugate is x minus eleven."],["Keep a. Change minus three to plus three.","The conjugate is a plus three."],["Keep a. Reverse the sign of b.","The conjugate is a plus b."],["Keep three x. Reverse the sign of seven.","The conjugate is three x minus seven."],["Keep two x. Reverse the sign of five y.","The conjugate is two x plus five y."],["Keep four n. Reverse the sign of nine.","The conjugate is four n minus nine."]],[["Multiply the firsts, outers, inners and lasts. Notice negative fifteen x and positive fifteen x.","The cross-products are additive inverses. They cancel.","The result is nine x squared minus twenty-five."],["Take the square roots of the two terms, three x and five.","Write the sum and the difference of the two roots.","Three x plus five, times three x minus five."],["Multiply each term. The cross-products are negative and positive eleven x.","They cancel. The result is x squared minus one hundred and twenty-one."],["Eleven squared is one hundred and twenty-one.","Write x plus eleven times x minus eleven."],["The cross-products are positive and negative twenty-eight x.","They cancel. Sixteen x squared minus forty-nine remains."],["The square roots are four x and seven.","Write four x plus seven times four x minus seven."]],[["Write two identical brackets.","Find four partial products. The inners and outers are both twelve x.","Double twelve x to get twenty-four x. The answer is nine x squared plus twenty-four x plus sixteen."],["The square roots of the end terms are three x and four.","Check twice their product. It is twenty-four x.","The perfect square is three x plus four, all squared."],["The two cross-products are both eight x.","Double eight x. The answer is x squared plus sixteen x plus sixty-four."],["The roots are x and eight.","Twice their product is sixteen x.","The answer is x plus eight, all squared."],["Both cross-products are negative fifteen x.","Add them to get negative thirty x. The answer is twenty-five x squared minus thirty x plus nine."],["The square roots are five x and three.","The middle term is negative. Choose subtraction in the bracket.","The answer is five x minus three, all squared."]]];
const $=id=>document.getElementById(id),letters='abcdef';let g=0,p=0,k=0;
const narration=window.WCMStepNarration?.mount($('audio'));
$('activity').replaceChildren(...groups.map((a,i)=>new Option(a.title,i)));
$('part').replaceChildren(...Array.from(letters,(l,i)=>new Option('('+l+')',i)));
function typeset(){if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('question'),$('solution')]).catch(()=>{})}
function render(){let a=groups[g],t=a.items[p];$('activity').value=g;$('part').value=p;$('focus').textContent=a.title;$('question').textContent='('+letters[p]+') '+(g===0?'Write the conjugate of ': '')+t[0];$('solution').replaceChildren(...t.slice(1,k+1).map(s=>{let d=document.createElement('div');d.className='step';d.textContent=s;return d}));$('status').textContent=k===t.length-1?'Check by reversing the process.':'Step '+k+' of '+(t.length-1);$('step').disabled=k>=t.length-1;$('previous').disabled=g===0&&p===0;$('next').disabled=g===2&&p===5;history.replaceState(null,'','#'+a.code+'-'+letters[p]);narration?.update(k?speech[g][p][k-1]:g===0?'Write the conjugate. Keep the first term and reverse the sign of the second.':t[0].startsWith('Expand')?'Expand the expression. Inspect the cross-products.':'Factorise the expression. Check the end terms and the middle term where present.',[g,p,k].join(':'));typeset()}
function move(d){p+=d;if(p<0){g--;p=5}if(p>5){g++;p=0}k=0;render()}
function readHash(){let [code,l]=location.hash.slice(1).split('-'),i=groups.findIndex(a=>a.code===code);if(i>=0){g=i;p=Math.max(0,letters.indexOf(l||'a'))}k=0;render()}
$('activity').onchange=()=>{g=+$('activity').value;p=k=0;render()};$('part').onchange=()=>{p=+$('part').value;k=0;render()};$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('step').onclick=()=>{k++;render()};$('reset').onclick=()=>{k=0;render()};$('full').onclick=()=>{document.body.classList.toggle('full');$('full').textContent=document.body.classList.contains('full')?'Show controls':'Maths only'};window.addEventListener('hashchange',readHash);window.addEventListener('load',typeset);readHash();
