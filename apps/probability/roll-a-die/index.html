<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roll a Die</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#213e52;background:#fff}
main{min-height:125px;display:flex;align-items:center;justify-content:center;gap:20px;padding:8px;flex-wrap:nowrap}.history{border-top:1px solid #e0e8ee;padding:6px 12px;min-height:43px;display:flex;align-items:center;gap:9px;overflow:hidden}.history-label{font-size:.78rem;color:#526779;flex:none}.rolls{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;min-width:0;flex:1;justify-content:flex-end}.rolls span{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border:1px solid #d7e5ef;border-radius:7px;background:#f4f9fc;font-weight:600;font-size:.85rem}.rolls span:last-child{border-color:#4d91bd;background:#e2f0fa}
button{border:1px solid #91b7d1;background:#eaf5fc;color:#174e75;border-radius:10px;padding:10px 20px;font-size:1rem;font-weight:650;cursor:pointer}
button:hover{background:#d9ecf9}button:focus-visible{outline:3px solid #2879b8;outline-offset:3px}
.die{width:94px;height:94px;border:3px solid #d1dae2;border-radius:19px;box-shadow:inset -5px -5px 8px #e9edf2,0 3px 8px #0002;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;gap:5px}
.pip{background:#173a55;border-radius:50%;width:13px;height:13px;place-self:center;visibility:hidden}
.die[data-face="1"] .p5,.die[data-face="2"] .p1,.die[data-face="2"] .p9,.die[data-face="3"] .p1,.die[data-face="3"] .p5,.die[data-face="3"] .p9,.die[data-face="4"] .p1,.die[data-face="4"] .p3,.die[data-face="4"] .p7,.die[data-face="4"] .p9,.die[data-face="5"] .p1,.die[data-face="5"] .p3,.die[data-face="5"] .p5,.die[data-face="5"] .p7,.die[data-face="5"] .p9,.die[data-face="6"] .p1,.die[data-face="6"] .p3,.die[data-face="6"] .p4,.die[data-face="6"] .p6,.die[data-face="6"] .p7,.die[data-face="6"] .p9{visibility:visible}
.controls{display:flex;flex-direction:column;align-items:center;gap:10px}.hint{font-size:.85rem;color:#526779;margin:0}
@media(max-width:320px){main{gap:10px}.die{width:82px;height:82px}.pip{width:11px;height:11px}}.questions{padding:8px 14px 12px;border-top:1px solid #e0e8ee;font-size:.9rem}.questions p{margin:4px 0 8px}.questions label{display:inline-flex;align-items:center;gap:3px;margin-right:12px}.feedback{min-height:1.3em;color:#236b46;font-weight:600}.history-label{white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main aria-label="Interactive six-sided die">
<div class="die" id="die" data-face="1" role="img" aria-label="Die showing 1"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
<div class="controls"><button type="button" id="roll">Roll the die</button><p class="hint" id="result" role="status" aria-live="polite">What will come up?</p></div>
</main><div class="history" aria-label="Previous rolls"><span class="history-label">Rolls:</span><div class="rolls" id="rolls" aria-live="off"></div></div><section class="questions"><p><strong>Think:</strong> Can the same number occur twice, three times or four times in a row? After seven rolls, must some number have repeated?</p><p><strong>What is the chance of rolling a 1 next?</strong></p><div role="group" aria-label="Choose the chance of a one"><label><input type="radio" name="chance" value="1/2"> 1/2</label><label><input type="radio" name="chance" value="1/6"> 1/6</label><label><input type="radio" name="chance" value="1/3"> 1/3</label><label><input type="radio" name="chance" value="depends"> Depends on earlier rolls</label></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p></section><script>
document.querySelectorAll('input[name="chance"]').forEach(x=>x.addEventListener('change',()=>{document.getElementById('feedback').textContent=x.value==='1/6'?'Correct. Each new roll has a 1 in 6 chance of showing 1.':'Try again. A fair die has six equally likely faces, and previous rolls do not change the next roll.';}));
const die=document.getElementById('die'),button=document.getElementById('roll'),result=document.getElementById('result'),rolls=document.getElementById('rolls');
button.addEventListener('click',()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);const n=(a[0]%6)+1;die.dataset.face=String(n);die.setAttribute('aria-label','Die showing '+n);result.textContent='You rolled '+n+'.';const chip=document.createElement('span');chip.textContent=String(n);rolls.appendChild(chip);while(rolls.scrollWidth>rolls.clientWidth&&rolls.children.length>1){rolls.firstElementChild.remove();}});
</script></body></html>
