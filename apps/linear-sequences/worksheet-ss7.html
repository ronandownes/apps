<!doctype html><html lang="en-IE"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:18px system-ui,sans-serif;color:#182331;max-width:1000px;margin:auto;padding:20px}a{color:#17558a}nav,.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{font:inherit;padding:9px 14px;background:white;color:inherit;border:1px solid #a5b0bf;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#174e83;color:white}button:disabled{opacity:.4}button:focus-visible{outline:3px solid #6aacf0}#math{font-family:Cambria Math,Georgia,serif;font-size:var(--size,38px);line-height:1.65}#working>div{padding:12px 0;border-bottom:1px solid #ddd}.small{font-size:15px;color:#536273}main:fullscreen{background:#fff;overflow:auto;padding:24px}[hidden]{display:none!important}.visual{display:block;width:min(100%,calc(var(--size,38px)*19));height:auto;margin:12px auto;font-family:Cambria Math,Cambria,Georgia,serif}.visual text{fill:#182331}.visual .arc{fill:none;stroke:#233548;stroke-width:1.8}.visual .back{stroke:#182331;stroke-width:2.2;fill:none}.visual .diff{font-size:25px}.visual .term{font-size:32px}.visual .pos{font:16px system-ui,sans-serif;fill:#596675}.visual .termzero{fill:white;stroke:#182331;stroke-width:2}.eqgrid{display:grid;grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr) minmax(120px,1.4fr);align-items:baseline;gap:9px 13px;margin:18px 0;max-width:100%;overflow-x:auto}.eqgrid .lhs{text-align:right}.eqgrid .rhs{text-align:left}.eqgrid .why{font:16px/1.4 system-ui,sans-serif;color:#566476}.eqgrid .last{font-weight:bold}.eqcheck{font-size:.75em;margin:14px 0}@media(max-width:550px){.eqgrid{grid-template-columns:auto auto 1fr;gap:5px 8px;font-size:min(var(--size),7vw)}.eqgrid .why{grid-column:1/-1;text-align:center;padding-bottom:8px}#math{font-size:min(var(--size),8vw)}}</style><body><main id="main"><nav><a href="https://ronandownes.github.io/book/sequences-intro.html">Book lesson</a><a href="term-zero.html">Interactive graph</a><a href="index.html">Learn · Quiz · Test</a></nav><title>SS7 — Find the position of a stated term</title><h1>SS7 — Find the position of a stated term</h1><p>Set the expression equal to the given term value. Form an equation and solve it.</p><div class="toolbar" id="questions"></div><div class="toolbar"><button id="prev">Previous question</button><button id="next">Next question</button><button id="step">Next step</button><button id="all">Show answer</button><button id="reset">Hide working</button><button id="minus">A−</button><button id="plus">A+</button><button id="full">Full screen</button></div><p id="status" class="small" aria-live="polite"></p><div id="math"><div id="question"></div><div id="working" aria-live="polite"></div></div></main><script>(()=>{const qs=[[5,2,52],[-4,23,-21],[6,-10,62],[7,5,96],[3,2,44],[-2,32,2],[8,1,129],[5,-17,68]];function build(q){let [d,c,t]=qs[q],f=N(d)+'n'+signed(c),n=(t-c)/d;return ['Tₙ = '+f+'; find the position of '+N(t),[f+' = '+N(t)+'    (form an equation)',N(d)+'n = '+N(t-c)+'    ('+(c>0?'subtract ':'add ')+Math.abs(c)+' on both sides)','n = '+N(n)+'    (divide both sides by '+N(d)+')','Check: '+N(d)+'('+N(n)+')'+signed(c)+' = '+N(t)+'. Term '+n+'.']]};let q=Math.max(0,Math.min(7,'abcdefgh'.indexOf((new URLSearchParams(location.search).get('q')||'a').toLowerCase().slice(0,1)))),step=0,size=38;const $=id=>document.getElementById(id),N=n=>String(n).replace('-','−'),signed=n=>n<0?' − '+Math.abs(n):' + '+n;function draw(){const [prompt,lines]=build(q);$('main').style.setProperty('--size',size+'px');$('questions').innerHTML=qs.map((_,i)=>'<button data-q="'+i+'" aria-pressed="'+(q===i)+'">'+String.fromCharCode(97+i)+'</button>').join('');$('questions').querySelectorAll('button').forEach(b=>b.onclick=()=>{q=+b.dataset.q;step=0;draw()});$('question').textContent='('+String.fromCharCode(97+q)+') '+prompt;let [d,c,t]=qs[q],p=(t-c)/d,eqs=[[N(d)+'n'+signed(c),N(t),'Form an equation'],[N(d)+'n',N(t-c),(c>0?'Subtract ':'Add ')+Math.abs(c)+' on both sides'],['n',N(p),'Divide both sides by '+N(d)]];let g=document.createElement('section');g.className='eqgrid';eqs.slice(0,Math.min(step,3)).forEach(([left,right,why],i)=>{for(let [cl,txt] of [['lhs',left],['equals','='],['rhs',right],['why',why]]){let el=document.createElement('span');el.className=cl+(i===2?' last':'');el.textContent=txt;g.appendChild(el)}});$('working').replaceChildren(g);if(step>=4){let check=document.createElement('p');check.className='eqcheck';check.textContent='Check: '+N(d)+'('+N(p)+')'+signed(c)+' = '+N(t)+'. Therefore '+N(t)+' is term '+p+'.';$('working').appendChild(check)}$('status').textContent='Question '+(q+1)+' of '+qs.length+' · Step '+step+' of '+lines.length;$('step').disabled=$('all').disabled=step===lines.length;$('prev').disabled=q===0;$('next').disabled=q===qs.length-1}$('step').onclick=()=>{step=Math.min(build(q)[1].length,step+1);draw()};$('all').onclick=()=>{step=build(q)[1].length;draw()};$('reset').onclick=()=>{step=0;draw()};$('prev').onclick=()=>{q=Math.max(0,q-1);step=0;draw()};$('next').onclick=()=>{q=Math.min(qs.length-1,q+1);step=0;draw()};$('minus').onclick=()=>{size=Math.max(20,size-4);draw()};$('plus').onclick=()=>{size=Math.min(80,size+4);draw()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('main').requestFullscreen()}catch(e){$('status').textContent='Use F11 for full screen'}};draw()})();</script></body></html>
