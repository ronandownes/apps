<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SS6 — Term zero and general term</title><style>body{font:18px system-ui,sans-serif;color:#182331;max-width:1000px;margin:auto;padding:20px}h1{font-size:clamp(24px,4vw,36px)}a{color:#17558a}nav,.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{font:inherit;padding:9px 14px;background:white;color:inherit;border:1px solid #a5b0bf;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#174e83;color:white}button:disabled{opacity:.4}button:focus-visible{outline:3px solid #6aacf0}#math{font-family:Cambria Math,Georgia,serif;font-size:var(--size,38px);line-height:1.6}svg{width:100%;max-width:700px;height:auto;display:block}#working>div{padding:12px 0;border-bottom:1px solid #ddd}.small{font-size:15px;color:#536273}main:fullscreen{background:#fff;overflow:auto;padding:24px}#formula{font-weight:bold}</style></head><body><main id="main"><nav><a href="https://ronandownes.github.io/book/sequences-intro.html">Book lesson</a><a href="term-zero.html">Interactive graph</a><a href="index.html">Learn · Quiz · Test</a></nav><h1>SS6 — Term zero and general term</h1><p>Same eight questions as your revision workbook. Find d, T₀ and Tₙ. Reveal one step at a time.</p><div class="toolbar" id="questions"></div><div class="toolbar"><button id="prev">Previous question</button><button id="next">Next question</button><button id="step">Next step</button><button id="all">Show answer</button><button id="reset">Hide working</button><button id="minus">A−</button><button id="plus">A+</button><button id="full">Full screen</button></div><p id="status" class="small" aria-live="polite"></p><div id="math"><div id="sequence"></div><div id="working" aria-live="polite"></div></div><svg id="graph" viewBox="0 0 600 290" role="img" aria-label="Graph of the sequence and associated straight line" hidden></svg></main><script>(()=>{const $=id=>document.getElementById(id),qs=[[7,5],[19,-4],[-4,6],[12,7],[5,3],[30,-2],[9,8],[-12,5]];let q=0,step=0,size=38;const N=n=>String(n).replace('-','−'),signed=n=>n<0?' − '+Math.abs(n):' + '+n,rule=(d,c)=>N(d)+'n'+(c?signed(c):'');function draw(){let [a,d]=qs[q],c=a-d,v=Array.from({length:5},(_,n)=>c+d*n);$('main').style.setProperty('--size',size+'px');$('questions').innerHTML=qs.map((_,i)=>'<button data-q="'+i+'" aria-pressed="'+(q===i)+'">'+String.fromCharCode(97+i)+'</button>').join('');$('questions').querySelectorAll('button').forEach(b=>b.onclick=()=>{q=+b.dataset.q;step=0;draw()});$('sequence').textContent='('+String.fromCharCode(97+q)+')    '+v.slice(1).map(N).join(',    ')+', …';let lines=['d = '+N(v[2])+' − ('+N(v[1])+') = '+N(d),'T₀ = '+N(a)+' − ('+N(d)+') = '+N(c),'Tₙ = dn + T₀ = '+rule(d,c)];$('working').innerHTML=lines.slice(0,step).map((s,i)=>'<div'+(i===2?' id="formula"':'')+'>'+s+'</div>').join('');$('status').textContent='Question '+(q+1)+' of 8 · Step '+step+' of 3';$('step').disabled=step===3;$('all').disabled=step===3;$('prev').disabled=q===0;$('next').disabled=q===7;let g=$('graph');g.hidden=step!==3;if(step===3){let lo=Math.min(0,...v)-3,hi=Math.max(0,...v)+3,X=i=>72+i*112,Y=t=>248-(t-lo)*216/(hi-lo),out='';for(let i=0;i<=4;i++)out+='<path d="M'+X(i)+' 25V248" stroke="#ddd"/><text x="'+X(i)+'" y="273" text-anchor="middle">'+i+'</text>';let inc=Math.max(1,Math.ceil((hi-lo)/8/5)*5);for(let t=Math.ceil(lo/inc)*inc;t<=hi;t+=inc)out+='<path d="M72 '+Y(t)+'H540" stroke="#ddd"/><text x="62" y="'+(Y(t)+5)+'" text-anchor="end">'+N(t)+'</text>';out+='<path d="M72 20V250 M60 '+Y(0)+'H555" stroke="#333" fill="none"/><path d="M72 '+Y(c)+'L520 '+Y(v[4])+'" stroke="#777" stroke-dasharray="5 4" fill="none"/>';v.forEach((t,i)=>out+='<circle cx="'+X(i)+'" cy="'+Y(t)+'" r="5" stroke="#174e83" stroke-width="2" fill="'+(i?'#174e83':'white')+'"/><text x="'+(X(i)+8)+'" y="'+(Y(t)-9)+'">'+N(t)+'</text>');g.innerHTML=out+'<text x="12" y="18">Tₙ</text><text x="558" y="273">n</text>'}}$('step').onclick=()=>{step=Math.min(3,step+1);draw()};$('all').onclick=()=>{step=3;draw()};$('reset').onclick=()=>{step=0;draw()};$('prev').onclick=()=>{q=Math.max(0,q-1);step=0;draw()};$('next').onclick=()=>{q=Math.min(7,q+1);step=0;draw()};$('minus').onclick=()=>{size=Math.max(20,size-4);draw()};$('plus').onclick=()=>{size=Math.min(80,size+4);draw()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('main').requestFullscreen()}catch(e){$('status').textContent='Use F11 for full screen'}};draw()})();</script></body></html>
