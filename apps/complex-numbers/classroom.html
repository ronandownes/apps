<!doctype html>
<html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complex numbers — classroom practice</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#182331;font:18px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:16px 28px}a{color:#17558a}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}h1{font-size:clamp(22px,3vw,34px);margin:12px 0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}button{font:inherit;font-size:16px;padding:9px 14px;border:1px solid #a5b0bf;border-radius:5px;background:#fff;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#164d83;color:white}button:focus-visible{outline:3px solid #559de2;outline-offset:3px}.board{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:18px}.problem{position:relative;min-width:0;min-height:clamp(160px,29vh,360px);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:28px 8px 16px;border:1px solid #dce1e7;border-radius:6px;cursor:pointer}.problem:focus-visible{outline:3px solid #559de2}.letter{position:absolute;top:10px;left:12px;font-size:18px}.equation{font-family:Cambria Math,Cambria,Georgia,serif;font-size:var(--size,46px);line-height:1.5;white-space:nowrap;max-width:100%;overflow-x:auto}.stack{display:inline-grid;grid-template-columns:auto auto;column-gap:.25em;text-align:right}.stack .rule{grid-column:1/-1;border-top:1.5px solid currentColor}.stack .real,.stack .imag{min-width:1.5em}.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.2}.num{border-bottom:1.5px solid currentColor;padding:0 .3em .13em}.den{padding:.13em .3em 0}.rails{border-left:2px solid #607080;border-right:2px solid #607080;padding:0 .4em}.answer{font-family:Cambria Math,Cambria,Georgia,serif;color:#156447;font-size:calc(var(--size,46px)*.8);margin-top:12px;text-align:center}.muted{font-size:14px;color:#556474}#status{min-height:1.2em}main:fullscreen{overflow:auto;background:white;padding:20px}main:fullscreen .problem{min-height:32vh}@media(max-width:700px){main{padding:10px}.board{gap:8px}.problem{min-height:145px}.equation{font-size:min(var(--size),7vw)}.answer{font-size:min(calc(var(--size)*.8),6vw)}}@media print{.toolbar,header,footer,.muted{display:none}.problem{break-inside:avoid;border:0;min-height:5cm}}
</style></head><body><main id="main"><header><a href="operations.html">← Complex-number apps</a><a href="../../index.html">Maths Apps</a></header><h1 id="heading">Multiply complex numbers</h1><div class="toolbar" aria-label="Operation"><button data-op="mul" aria-pressed="true">Multiply</button><button data-op="div">Divide</button><button data-op="add">Add</button><button data-op="sub">Subtract</button><button id="new">New questions</button><button id="full">Full screen</button></div><div class="toolbar" aria-label="Display"><button id="inline" aria-pressed="true">Inline</button><button id="stacked" aria-pressed="false">Stacked</button><button id="bars" aria-pressed="false" title="Visual alignment guides, not modulus notation">Side guides</button><button id="smaller" aria-label="Decrease font size">A−</button><button id="larger" aria-label="Increase font size">A+</button><button id="cols">2 across</button><button id="answers">Show answers</button></div><div id="board" class="board"></div><p class="muted">Click a question to reveal its answer. Give answers in the form a + bi. Remember i² = −1.</p><p class="muted" id="status" role="status"></p><footer><a href="operations.html#multiply">Worked multiplication</a> · <a href="operations.html#divide">Worked division</a></footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let op='mul',layout='inline',bars=false,size=46,cols=2,questions=[[3,2,4,-5],[5,3,2,4],[7,-2,3,-4],[-4,3,5,-2]],revealed=new Set();const N=n=>String(n).replace('-','−'),im=b=>(Math.abs(b)===1?'':Math.abs(b))+'<i>i</i>',signed=b=>(b<0?'− ':'+ ')+im(b);
function z(a,b){if(!b)return N(a);return (a?N(a)+(b<0?' − ':' + '):b<0?'−':'')+im(b)}
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function frac(n,d){const g=gcd(n,d);n/=g;d/=g;return d===1?N(n):'<span class="frac"><span class="num">'+N(n)+'</span><span class="den">'+d+'</span></span>'}
function q(a,b,c,d){const h=c*c+d*d,r=a*c+b*d,s=b*c-a*d;let out=r?frac(r,h):'';if(s)out+=(s<0?(out?' − ':'−'):(out?' + ':''))+(Math.abs(s)===h?'':frac(Math.abs(s),h))+'<i>i</i>';return out||'0'}
const names={mul:'Multiply',div:'Divide',add:'Add',sub:'Subtract'},sym={mul:'×',div:'÷',add:'+',sub:'−'};
function draw(){document.documentElement.style.setProperty('--size',size+'px');$('board').style.setProperty('--cols',cols);$('heading').textContent=names[op]+' complex numbers';$('cols').textContent=cols+' across';$('answers').textContent=revealed.size===4?'Hide answers':'Show answers';document.querySelectorAll('[data-op]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.op===op)));$('inline').setAttribute('aria-pressed',String(layout==='inline'));$('stacked').setAttribute('aria-pressed',String(layout==='stacked'));$('bars').setAttribute('aria-pressed',String(bars));$('board').innerHTML=questions.map(([a,b,c,d],i)=>{let x=z(a,b),y=z(c,d),expr;if(layout==='inline')expr='('+x+')'+(op==='mul'?'': ' '+sym[op]+' ')+'('+y+')';else if(op==='div')expr='<span class="frac"><span class="num">'+x+'</span><span class="den">'+y+'</span></span>';else expr='<span class="stack"><span class="real">'+N(a)+'</span><span class="imag">'+signed(b)+'</span><span class="real">'+sym[op]+' &nbsp;'+N(c)+'</span><span class="imag">'+signed(d)+'</span><span class="rule"></span></span>';if(bars&&layout==='stacked'&&op!=='div')expr='<span class="rails">'+expr+'</span>';let ans=op==='mul'?z(a*c-b*d,a*d+b*c):op==='div'?q(a,b,c,d):op==='add'?z(a+c,b+d):z(a-c,b-d);return '<div class="problem" role="button" tabindex="0" data-i="'+i+'" aria-label="Question '+(i+1)+', reveal or hide answer"><span class="letter">('+String.fromCharCode(97+i)+')</span><div class="equation">'+expr+'</div>'+(revealed.has(i)?'<div class="answer">= '+ans+'</div>':'')+'</div>'}).join('');$('board').querySelectorAll('[data-i]').forEach(el=>{const toggle=()=>{let i=+el.dataset.i;revealed.has(i)?revealed.delete(i):revealed.add(i);draw();$('board').querySelector('[data-i="'+i+'"]').focus()};el.onclick=toggle;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}})}
function generate(){const r=()=>1+Math.floor(Math.random()*9);questions=Array.from({length:4},(_,i)=>{let a=r(),b=r(),c=r(),d=r();return [[a,b,c,-d],[a,b,c,d],[a,-b,c,-d],[-a,b,c,-d]][i]});revealed.clear();draw()}
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{op=b.dataset.op;if(op==='div')layout='stacked';revealed.clear();draw()});$('new').onclick=generate;$('inline').onclick=()=>{layout='inline';draw()};$('stacked').onclick=()=>{layout='stacked';draw()};$('bars').onclick=()=>{bars=!bars;if(bars)layout='stacked';draw()};$('smaller').onclick=()=>{size=Math.max(20,size-4);draw()};$('larger').onclick=()=>{size=Math.min(100,size+4);draw()};$('cols').onclick=()=>{cols=3-cols;draw()};$('answers').onclick=()=>{revealed=revealed.size===4?new Set():new Set([0,1,2,3]);draw()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('main').requestFullscreen()}catch(e){$('status').textContent='Use F11 for browser full screen.'}};draw()})();
</script></body></html>
