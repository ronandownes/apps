<html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complex numbers | Maths Apps</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#fff;color:#182331;font:17px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px 24px}a{color:#17558a}h1{font-size:clamp(24px,4vw,34px);margin:12px 0}p{line-height:1.5}small{color:#536273}.inputs{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0}.pair{display:flex;align-items:center;gap:6px;font-family:Cambria,serif;font-size:22px}input{width:64px;padding:8px 4px;border:1px solid #8695a6;border-radius:5px;font:inherit;text-align:center}button{font:inherit;padding:8px 16px;border:1px solid #8695a6;border-radius:6px;background:white;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #4a92d2;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap}.step{padding:12px 0;border-bottom:1px solid #e1e5ea}.step p{margin:0 0 8px;font-size:15px;color:#4c5969}.equation{font-size:clamp(20px,4vw,29px);overflow-x:auto;padding:5px 0;text-align:center}math{font-size:inherit}.result{border-bottom:0;border-top:2px solid #22334a}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.links a{border:1px solid #d4dce4;border-radius:6px;padding:14px;text-decoration:none;font-weight:600}#status{color:#536273}#error{color:#a02020}svg{width:100%;max-width:420px;display:block;margin:auto}footer{margin-top:20px;font-size:14px} @media(max-width:430px){main{padding:12px}.pair{font-size:18px}input{width:54px}} 
</style></head><body><main><small><a href="../../number/complex-numbers/index.html">Number / Complex numbers</a> · LC Ordinary Level</small><h1 id="title">Complex numbers</h1><p id="intro"></p><div id="home" class="links"></div><section id="app" hidden><div class="inputs" id="inputs"><div class="pair"><span>z =</span><input id="a" type="number" min="-99" max="99" step="1" value="2" aria-label="Real part of z"><span>+</span><input id="b" type="number" min="-99" max="99" step="1" value="5" aria-label="Imaginary coefficient of z"><i>i</i></div><div class="pair" id="second"><span id="secondLabel">w =</span><input id="c" type="number" min="-99" max="99" step="1" value="2" aria-label="Real part of w or scalar"><span id="imaginary"><span>+</span> <input id="d" type="number" min="-99" max="99" step="1" value="3" aria-label="Imaginary coefficient of w"> <i>i</i></span></div></div><div class="actions"><button id="next">Next step</button><button id="all">Show all</button><button id="reset">Start again</button><button id="random">New question</button></div><p id="status" aria-live="polite"></p><p id="error" role="alert"></p><div id="steps" aria-live="polite"></div></section><footer><a href="operations.html">All complex-number apps</a> · <a href="https://ronandownes.github.io/book/chapter-complex.html">Read the book</a> · <a href="index.html">Argand explorer</a></footer></main>
<script type="module">
const $=id=>document.getElementById(id);
const ops={add:"Addition",subtract:"Subtraction",multiply:"Multiplication",divide:"Division",conjugate:"Conjugate",modulus:"Modulus",scalar:"Multiply by a real number",plot:"Argand diagram"};
const op=location.hash.slice(1); 
const N=n=>n<0?"−"+Math.abs(n):String(n), par=n=>n<0?"("+N(n)+")":N(n), abs=Math.abs;
const gcd=(a,b)=>b?gcd(b,a%b):abs(a);
const f=(n,d=1)=>{let g=gcd(n,d);return [n/g,d/g]};
const conjugate=([a,b])=>[a,-b], norm2=([a,b])=>a*a+b*b;
const multiply=([a,b],[c,d])=>[a*c-b*d,a*d+b*c];
const divide=(z,w)=>{let q=norm2(w);if(!q)throw Error("Division by zero is undefined. Change the divisor.");return multiply(z,conjugate(w)).map(n=>f(n,q))};
const text=s=>'<mtext>'+s+'</mtext>', num=n=>'<mn>'+N(n)+'</mn>', frac=(n,d)=>'<mfrac>'+n+d+'</mfrac>', math=s=>'<math xmlns="http://www.w3.org/1998/Math/MathML" display="block">'+s+'</math>';
const cf=([n,d])=>d===1?num(n):frac(num(n),num(d));
function zstr(a,b){if(!b)return N(a);return (a?N(a)+(b<0?" − ":" + "):b<0?"−":"")+(abs(b)===1?"":abs(b))+"i"}
const z=([a,b])=>text(zstr(a,b)), bracket=p=>text("("+zstr(...p)+")");
const eq=text(" = "), times=text(" × "), step=(label,content)=>({label,html:math(content)});
function rationalZ([[a,b],[c,d]]){if(!c)return cf([a,b]);let im=(abs(c)===d?"":cf([abs(c),d]))+text("i");return (a?cf([a,b])+text(c<0?" − ":" + "):c<0?text("−"):"")+im}
function expansion(a,b,c,d){return text(N(a*c)+(a*d<0?" − ":" + ")+abs(a*d)+"i"+(b*c<0?" − ":" + ")+abs(b*c)+"i"+(b*d<0?" − ":" + ")+abs(b*d)+"i²")}
function productSteps(x,y){let [a,b]=x,[c,d]=y,r=multiply(x,y);return [step("Expand the four products.",bracket(x)+bracket(y)+eq+expansion(a,b,c,d)),step("Use i² = −1 and collect real and imaginary terms.",text("("+N(a*c)+" − "+par(b*d)+") + ("+N(a*d)+" + "+par(b*c)+")i")+eq+z(r))]}
function build(x,y){let [a,b]=x,[c,d]=y;switch(op){
case "multiply":return [step("Question",bracket(x)+bracket(y)),...productSteps(x,y),step("Answer",z(multiply(x,y)))];
case "divide":{let q=norm2(y),w=conjugate(y),r=multiply(x,w),ans=divide(x,y);return [step("Question",frac(z(x),z(y))),step("Multiply above and below by the conjugate of the denominator.",frac(bracket(x)+bracket(w),bracket(y)+bracket(w))),step("The denominator is the square of the modulus.",frac(bracket(x)+bracket(w),text(par(c)+"² + "+par(d)+"²"))),step("Expand the numerator using the distributive law.",frac(expansion(a,b,c,-d),num(q))),step("Use i² = −1 and collect like terms.",frac(z(r),num(q))),step("Answer in the form a + bi.",rationalZ(ans))]}
case "add":case "subtract":{let s=op==="add"?1:-1,k=s===1?" + ":" − ";return [step("Question",bracket(x)+text(k)+bracket(y)),step("Combine corresponding parts.",text("("+N(a)+k+par(c)+") + ("+N(b)+k+par(d)+")i")),step("Answer",z([a+s*c,b+s*d]))]}
case "scalar":return [step("Question",num(c)+bracket(x)),step("Multiply both parts by the real number.",text(par(c)+" × "+par(a)+" + ("+par(c)+" × "+par(b)+")i")),step("Answer",z([c*a,c*b]))];
case "conjugate":return [step("Question",text("Find the conjugate of ")+z(x)),step("Keep the real part and reverse the imaginary part.",z(conjugate(x)))];
case "modulus":{let q=norm2(x);return [step("Question",text("|")+z(x)+text("|")),step("Apply Pythagoras.",'<msqrt>'+text(par(a)+"² + "+par(b)+"²")+'</msqrt>'),step("Answer",Number.isInteger(Math.sqrt(q))?num(Math.sqrt(q)):'<msqrt>'+num(q)+'</msqrt>')]}
case "plot":{let L=Math.max(5,abs(a),abs(b))+1,k=180/L,px=210+a*k,py=210-b*k;return [step("Identify the coordinates.",z(x)+text(" ↔ ("+N(a)+", "+N(b)+")")),{label:"Plot the point on the Argand diagram.",html:'<svg viewBox="0 0 420 420" role="img" aria-label="Argand diagram showing the point '+a+', '+b+'"><line x1="20" y1="210" x2="400" y2="210" stroke="currentColor"/><line x1="210" y1="20" x2="210" y2="400" stroke="currentColor"/><text x="380" y="202">Re</text><text x="220" y="30">Im</text><path d="M210 210 L'+px+' '+py+'" stroke="#17558a" stroke-width="3"/><circle cx="'+px+'" cy="'+py+'" r="5" fill="#17558a"/><text x="'+Math.min(px+8,340)+'" y="'+Math.max(py-10,15)+'">('+a+', '+b+')</text></svg>'}]}
}}
let count=1;
function render(){let values=["a","b","c","d"].map(id=>$(id).valueAsNumber);$("error").textContent="";$("steps").innerHTML="";try{if(!values.every(v=>Number.isInteger(v)&&abs(v)<=99))throw Error("Enter whole numbers from −99 to 99.");let steps=build(values.slice(0,2),values.slice(2));count=Math.min(count,steps.length);$("steps").innerHTML=steps.slice(0,count).map((s,i)=>'<div class="step '+(i===steps.length-1?"result":"")+'"><p>'+s.label+'</p><div class="equation">'+s.html+'</div></div>').join("");$("status").textContent="Step "+count+" of "+steps.length;$("next").disabled=count===steps.length;$("all").disabled=count===steps.length}catch(e){$("error").textContent=e.message;$("status").textContent="";$("next").disabled=$("all").disabled=true}}
function start(){if(!Object.hasOwn(ops,op)){$("intro").textContent="Choose one operation. Each app has a single purpose.";$("home").innerHTML=Object.entries(ops).map(([k,v])=>'<a href="#'+k+'">'+v+'</a>').join("");return}$("title").textContent="Complex numbers: "+ops[op];document.title=ops[op]+" | Complex numbers";$("intro").textContent=op==="divide"?"Multiply by the conjugate of the denominator.": "Work through one calculation at a time.";$("app").hidden=false;$("second").hidden=["conjugate","modulus","plot"].includes(op);if(op==="scalar"){$("secondLabel").textContent="k =";$("imaginary").hidden=true}render()}
$("next").onclick=()=>{count++;render()};$("all").onclick=()=>{count=100;render()};$("reset").onclick=()=>{count=1;render()};$("random").onclick=()=>{for(let id of ["a","b","c","d"])$(id).value=Math.floor(Math.random()*13)-6;if(!$("c").valueAsNumber&&!$("d").valueAsNumber)$("c").value=1;count=1;render()};for(let id of ["a","b","c","d"])$(id).oninput=()=>{count=1;render()};window.addEventListener("hashchange",()=>location.reload());start();
</script></body></html>
